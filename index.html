<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c35">
  <title>Codex 周额度面板</title>
  <style>
    :root { --ink:#e9f0ff; --muted:#9eacc7; --line:rgba(173,195,237,.16); --panel:rgba(26,43,76,.76); --aqua:#67e8d1; --violet:#9c8cff; --warn:#ffbf69; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); background:#101c35; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 15% 4%,#274e75 0,transparent 33rem),radial-gradient(circle at 88% 95%,#3b3269 0,transparent 38rem),linear-gradient(135deg,#101c35,#16284a); }
    main { position:relative; max-width:1040px; margin:auto; padding:48px 24px 36px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; margin-bottom:36px; } .eyebrow { color:var(--aqua); font:700 12px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:clamp(30px,5vw,52px); letter-spacing:-.055em; line-height:1.06; } .sub { max-width:570px; margin:0; color:var(--muted); }
    .status { flex:none; border:1px solid var(--line); border-radius:999px; padding:9px 13px; color:var(--aqua); background:rgba(19,37,67,.55); white-space:nowrap; font-size:13px; } .status i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--aqua); margin-right:7px; box-shadow:0 0 12px var(--aqua); }
    .grid { display:grid; grid-template-columns:1.25fr .75fr; gap:18px; } .card { border:1px solid var(--line); background:var(--panel); border-radius:22px; padding:24px; box-shadow:0 18px 65px rgba(2,8,23,.2); backdrop-filter:blur(10px); }
    .label { color:var(--muted); font-size:13px; } .big { margin:8px 0 0; font-size:clamp(54px,9vw,91px); line-height:.9; letter-spacing:-.08em; font-weight:750; } .big small { font-size:.34em; letter-spacing:-.03em; color:var(--muted); }
    .rail { height:16px; margin:30px 0 9px; border:1px solid rgba(255,255,255,.12); border-radius:99px; background:#0c172d; overflow:hidden; } .fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--aqua),#6db7ff); box-shadow:0 0 18px rgba(103,232,209,.5); transition:width .7s ease; min-width:3px; }
    .rail-meta,.row { display:flex; justify-content:space-between; gap:14px; color:var(--muted); font-size:13px; } .metric { padding:2px 0 18px; border-bottom:1px solid var(--line); margin-bottom:17px; } .metric:last-child { border:0; margin:0; padding-bottom:0; } .metric strong { display:block; margin-top:3px; font-size:23px; color:var(--ink); letter-spacing:-.04em; }
    .bottom { margin-top:18px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; } .number { font-size:27px; letter-spacing:-.055em; margin-top:4px; } .good { color:var(--aqua) } .behind { color:var(--warn) }
    .note { margin:26px 2px 0; color:var(--muted); font-size:13px; } .note b { color:#cbd8f2; font-weight:600 } footer { display:flex; justify-content:space-between; gap:16px; margin-top:42px; color:#7f90ad; font-size:12px; }
    @media(max-width:700px){ main{padding:32px 16px 24px} header{display:block}.status{display:inline-block;margin-top:20px}.grid,.bottom{grid-template-columns:1fr}.card{padding:20px} footer{display:block}footer span{display:block;margin-top:5px} }
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">Codex usage tracker</div><h1>周额度，心里有数。</h1><p class="sub">按本周已过去的时间计算应有的累计消耗进度。只做记录，不鼓励为了清额度而硬用。</p></div><div class="status"><i></i>最近同步正常</div></header>
  <section class="grid">
    <article class="card"><div class="label">本周已用</div><div class="big" id="used">0.00<small>%</small></div><div class="rail"><div class="fill" id="fill"></div></div><div class="rail-meta"><span>0%</span><span>周额度 100%</span></div></article>
    <article class="card"><div class="metric"><div class="label">截至现在计划应已用</div><strong id="target">0.00%</strong></div><div class="metric"><div class="label">当前累计进度</div><strong id="pace">—</strong></div><div class="metric"><div class="label">本周剩余时间</div><strong id="remaining">—</strong></div></article>
  </section>
  <section class="bottom">
    <article class="card"><div class="label">领先 / 落后</div><div class="number" id="delta">—</div></article>
    <article class="card"><div class="label">追上当前目标还差</div><div class="number" id="gap">—</div></article>
    <article class="card"><div class="label">每日平均参考</div><div class="number">14.29%</div></article>
  </section>
  <p class="note" id="note"></p>
  <footer><span id="updated">同步时间：—</span><span>周期长度：7 天 · 数据来自 Codex 使用额度</span></footer>
</main>
<script>
  // The nightly automation replaces only this object when it publishes a new snapshot.
  const syncedData = { used: 10, elapsed: 4.46875, updatedAt: '2026-10-26T14:02:55Z' };const f = n => Number(n).toFixed(2);
  const used = Number(syncedData.used), elapsed = Number(syncedData.elapsed), delta = used - elapsed;
  document.querySelector('#used').innerHTML = `${f(used)}<small>%</small>`;
  document.querySelector('#fill').style.width = `${Math.min(100, Math.max(0, used))}%`;
  document.querySelector('#target').textContent = `${f(elapsed)}%`;
  document.querySelector('#delta').textContent = `${delta >= 0 ? '领先 ' : '落后 '}${f(Math.abs(delta))} 个百分点`;
  document.querySelector('#delta').className = `number ${delta >= 0 ? 'good' : 'behind'}`;
  document.querySelector('#gap').textContent = delta >= 0 ? '已达到当前目标' : `${f(Math.abs(delta))}%`;
  document.querySelector('#pace').textContent = elapsed < .05 ? '周期刚重置' : (delta >= 0 ? '领先计划' : '暂落后计划');
  document.querySelector('#remaining').textContent = `${f(100-elapsed)}% 周期未过`;
  document.querySelector('#updated').textContent = `同步时间：${new Date(syncedData.updatedAt).toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})}`;
  document.querySelector('#note').innerHTML = elapsed < .05 ? '<b>提示：</b>周周期刚重置，使用比例按整数返回，短时间内无法据此精确判断实际进度。' : '<b>提示：</b>进度只用于观察节奏；无需为了达到目标刻意消耗额度。';
</script>
</body>
</html>
