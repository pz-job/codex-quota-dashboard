<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一周白饭额度 · 本地预览</title>
  <style>
    :root{--ink:#4b3020;--muted:#957253;--paper:#fff2d2;--red:#b93822;--gold:#efa84a;--green:#43825a}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(#fff9e8 1px,transparent 1px) 0 0/22px 22px,linear-gradient(145deg,#e8a05f 0 34%,#bd3829 34% 71%,#f1c36e 71%)}
    main{max-width:1020px;margin:auto;padding:46px 22px 32px}.label{font-size:12px;font-weight:900;letter-spacing:.16em;color:#813323;background:#ffe9b3;padding:6px 10px;border-radius:99px;display:inline-block}h1{font-size:clamp(38px,6vw,74px);line-height:.96;letter-spacing:-.09em;margin:14px 0 12px;color:#fff8e7;text-shadow:0 4px #a82e23}.sub{max-width:590px;margin:0;color:#fff2cd;font-weight:700}.layout{display:grid;grid-template-columns:1.18fr .82fr;gap:22px;align-items:stretch;margin-top:28px}.card{background:rgba(255,248,229,.93);border:3px solid #fff4d8;border-radius:31px;box-shadow:0 13px 0 rgba(100,36,22,.25),0 28px 45px rgba(82,24,14,.18);padding:23px}
    .rice-card{padding:0;min-height:590px;position:relative;overflow:hidden;background:radial-gradient(circle at 8% 9%,#fffdf7 0 2px,transparent 3px) 0 0/31px 31px,#f9d98c}.rice-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(168,48,30,.1));pointer-events:none}.caption{position:absolute;z-index:2;left:22px;top:22px;color:#813124;font-size:18px;font-weight:900;line-height:1.2}.caption strong{display:block;font-size:35px;letter-spacing:-.07em;color:#c3412c}.tower-wrap{height:580px;position:relative;display:flex;justify-content:center;align-items:flex-end}.tower{height:540px;width:88%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 7px rgba(91,34,15,.22));clip-path:inset(calc(var(--used) * .74%) 0 0 0);transition:clip-path .9s ease}.token-mark{position:absolute;z-index:2;bottom:80px;left:50%;transform:translateX(-50%);padding:3px 13px 5px;border-radius:8px;border:2px solid rgba(119,50,19,.45);color:#fff0c9;background:rgba(139,58,20,.76);font:900 25px/.95 ui-rounded,system-ui;letter-spacing:.09em;text-shadow:0 2px 0 #7a3113;box-shadow:0 3px 0 rgba(92,37,13,.23)}.mascot-button{position:absolute;z-index:4;right:-18px;bottom:0;width:182px;padding:0;border:0;background:transparent;cursor:pointer;transform-origin:50% 90%;transition:filter .2s ease}.mascot-svg{display:block;width:100%;height:auto;overflow:visible}.mascot-button:hover{filter:drop-shadow(0 7px 5px rgba(99,41,15,.2))}.mascot-button:focus-visible{outline:3px solid #b93822;outline-offset:2px;border-radius:40%}.float{transform-origin:120px 260px;animation:idle-float 3s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}.steam{transform-origin:center;animation:steam-rise 2s ease-in-out infinite}.mascot-button.hop{animation:mascot-hop .62s ease}.mascot-button.sway{animation:mascot-sway .62s ease}.mascot-button.munch{animation:mascot-munch .62s ease}.mascot-button.munch .rice-bowl{transform-box:fill-box;transform-origin:center;animation:bowl-bounce .62s ease}.mascot-button.is-active:after{content:"✦";position:absolute;right:8px;top:34px;color:#efa84a;font-size:27px;animation:twinkle .62s ease forwards;pointer-events:none}@keyframes idle-float{50%{transform:translateY(-3px)}}@keyframes blink{0%,94%,97%,100%{transform:scaleY(1)}95%,96%{transform:scaleY(.08)}}@keyframes steam-rise{0%,100%{opacity:.45;transform:translateY(3px)}50%{opacity:1;transform:translateY(-4px)}}@keyframes bowl-bounce{30%,70%{transform:translateY(-3px) rotate(2deg)}50%{transform:translateY(1px) rotate(-2deg)}}@keyframes mascot-hop{50%{transform:translateY(-18px) rotate(-3deg)}80%{transform:translateY(2px) rotate(2deg)}}@keyframes mascot-sway{25%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-2deg)}}@keyframes mascot-munch{25%,65%{transform:scale(1.035,.97) rotate(2deg)}45%,80%{transform:scale(.99,1.02) rotate(-2deg)}}@keyframes twinkle{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1.2) rotate(35deg)}100%{opacity:0;transform:scale(.5) rotate(80deg)}}@media(prefers-reduced-motion:reduce){.float,.eyes,.steam,.mascot-button,.mascot-button.hop,.mascot-button.sway,.mascot-button.munch,.mascot-button.munch .rice-bowl{animation:none!important;transition:none!important}}.fish-bubble{position:absolute;z-index:5;right:132px;bottom:225px;background:#fff9e8;color:#93452b;border:2px solid #e2a059;border-radius:15px;padding:5px 8px;font-size:11px;font-weight:900;white-space:nowrap}.fish-bubble:after{content:"";position:absolute;right:-8px;bottom:7px;width:12px;height:12px;background:#fff9e8;border-right:2px solid #e2a059;border-top:2px solid #e2a059;transform:rotate(45deg)}.eaten{position:absolute;left:18px;bottom:18px;background:#fff4d9;color:#8b4829;border:2px solid #e0a75f;border-radius:18px;padding:8px 10px;font-size:12px;font-weight:800;z-index:3}
    .stat{padding:16px 0;border-bottom:1px dashed #d9aa69}.stat:first-child{padding-top:1px}.stat:last-child{border:0}.stat span{display:block;font-size:13px;color:var(--muted);font-weight:700}.stat b{display:block;font-size:25px;letter-spacing:-.06em;margin-top:3px}.big{font-size:58px!important;color:#c6402b}.big small{font-size:.4em}.meter{height:17px;background:#ecd39b;border-radius:99px;overflow:hidden;border:2px solid #dca962;margin:10px 0 4px}.meter i{display:block;height:100%;background:repeating-linear-gradient(100deg,#fffef8 0 10px,#efdcae 11px 13px);border-radius:inherit}.hint{font-size:13px;color:#fff1d5;text-align:center;margin:24px 0 0}.hint b{color:#fff}
    @media(max-width:720px){main{padding:28px 15px}.layout{grid-template-columns:1fr}.rice-card{min-height:520px}.tower-wrap{height:510px}.tower{height:470px}.mascot-button{width:145px;right:-16px;bottom:17px}.fish-bubble{right:102px;bottom:180px}.caption strong{font-size:30px}}
  </style>
</head>
<body>
<main>
  <span class="label">CODEX WEEKLY TOKEN</span>
  <h1>白饭堆成山，<br>才叫一周额度呀。</h1>
  <p class="sub">整座饭塔代表满额；每用一点，塔尖就被吃掉一点。现在一眼能看出还剩多少饭。</p>
  <section class="layout">
    <article class="card rice-card">
      <div class="caption">这周已经吃掉<strong id="used">0.00%</strong></div>
      <div class="tower-wrap"><img class="tower" id="tower" src="rice-tower.png" alt="高高堆起的大米饭山"><span class="token-mark">TOKEN</span><span class="eaten" id="eaten">还很高</span><span class="fish-bubble" id="mascot-message" aria-live="polite">咩咩先吃一口！</span><button type="button" class="mascot-button" aria-label="和咩咩互动"><svg class="mascot-svg" aria-hidden="true" viewBox="0 0 240 280" role="img" aria-label="咩咩：奶油色卷发、淡紫弯角、蓝灰毛衣，双手捧着白饭" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f1ddc6"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe9dc"/><stop offset="1" stop-color="#f5cdb9"/></linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8c9d5"/><stop offset="1" stop-color="#8fa7b8"/></linearGradient>
  </defs>
  <g class="float">
    <g class="steam">
      <path d="M94 139c-10-9 8-12 0-22M119 135c-10-9 8-12 0-22M144 139c-10-9 8-12 0-22" fill="none" stroke="#e5a858" stroke-width="3" stroke-linecap="round"/>
      <path d="m89 119 4-5 4 5m18-5 4-5 4 5m18 5 4-5 4 5" fill="none" stroke="#efbf72" stroke-width="2"/>
    </g>
    <!-- sweater silhouette, oversized sleeves -->
    <path d="M67 169Q82 154 99 158h42q19-4 34 11l35 22-19 35-22-12 8 52H62l8-52-22 12-18-35z" fill="url(#sweater)" stroke="#a87962" stroke-width="3" stroke-linejoin="round"/>
    <path d="m96 157 24 21 24-21-8-9h-31z" fill="#fff8eb" stroke="#a87962" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m112 166 8 6 8-6-8 17z" fill="#f4e8d9" stroke="#a87962" stroke-width="2"/>
    <circle cx="120" cy="183" r="3" fill="#b7856c"/>
    <!-- small sweater sheep and star -->
    <g fill="#fff8ec" stroke="#b7866b" stroke-width="1.4">
      <circle cx="165" cy="206" r="8"/><circle cx="158" cy="205" r="6"/><circle cx="172" cy="205" r="6"/><circle cx="165" cy="199" r="6"/>
    </g><circle cx="162" cy="205" r="1" fill="#805d4e"/><circle cx="168" cy="205" r="1" fill="#805d4e"/><path d="M162 209q3 3 6 0" fill="none" stroke="#805d4e" stroke-width="1.4" stroke-linecap="round"/>
    <path d="m190 196 2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#efb75f"/>
    <!-- small human ears -->
    <ellipse cx="62" cy="100" rx="11" ry="15" fill="url(#skin)" stroke="#b87e68" stroke-width="2"/>
    <ellipse cx="178" cy="100" rx="11" ry="15" fill="url(#skin)" stroke="#b87e68" stroke-width="2"/>
    <!-- curved lavender horns -->
    <path d="M76 78Q48 74 48 52q1-17 18-23-7 14 2 21 8 5 18-4 1 18-10 30z" fill="#cbb9e6" stroke="#a87972" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M164 78q28-4 28-26-1-17-18-23 7 14-2 21-8 5-18-4-1 18 10 30z" fill="#cbb9e6" stroke="#a87972" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M57 48q5 8 15 10m105-10q-5 8-15 10" fill="none" stroke="#e7dcf3" stroke-width="3" stroke-linecap="round"/>
    <!-- fluffy curls behind face -->
    <path d="M55 111q-13-18 3-30-8-19 12-28 1-22 22-22 11-20 30-8 20-12 31 8 22 0 22 22 20 10 11 28 16 18 2 34l-13 31H66z" fill="url(#wool)" stroke="#ad7965" stroke-width="3" stroke-linejoin="round"/>
    <g fill="url(#wool)" stroke="#ad7965" stroke-width="2.4">
      <circle cx="71" cy="73" r="21"/><circle cx="94" cy="50" r="22"/><circle cx="120" cy="43" r="24"/><circle cx="147" cy="53" r="23"/><circle cx="169" cy="76" r="21"/>
      <circle cx="65" cy="101" r="20"/><circle cx="175" cy="103" r="20"/><circle cx="77" cy="126" r="19"/><circle cx="163" cy="128" r="19"/>
    </g>
    <!-- human face -->
    <ellipse cx="120" cy="101" rx="49" ry="55" fill="url(#skin)" stroke="#b87e68" stroke-width="2.5"/>
    <!-- curls framing forehead -->
    <g fill="url(#wool)" stroke="#ad7965" stroke-width="2">
      <path d="M75 88q-5-22 12-29 4-17 21-16 10-16 22-7 19-5 21 13 18 8 11 27-11 1-17-10-4 19-20 20-7-17-18-5-12 15-32 7z"/>
      <path d="M71 103q-8 15 5 25 9 6 17-7l-3-20z"/><path d="M168 99q10 14-1 27-9 7-17-6l3-19z"/>
    </g>
    <!-- eyes, blush, smile -->
    <g class="eyes">
      <ellipse class="eye" cx="101" cy="105" rx="5" ry="8" fill="#594239"/>
      <ellipse class="eye" cx="139" cy="105" rx="5" ry="8" fill="#594239"/>
      <circle cx="102.5" cy="102.5" r="1.8" fill="#fff"/><circle cx="140.5" cy="102.5" r="1.8" fill="#fff"/>
    </g>
    <ellipse cx="86" cy="119" rx="9" ry="5" fill="#e99c91" opacity=".65"/><ellipse cx="154" cy="119" rx="9" ry="5" fill="#e99c91" opacity=".65"/>
    <path d="M115 118q5 4 10 0m-8 8q5 7 12 0" fill="none" stroke="#9d6257" stroke-width="2.6" stroke-linecap="round"/>
    <!-- gold rice-grain hair clip and dangling four-point star -->
    <g transform="rotate(-35 77 81)">
      <ellipse cx="77" cy="81" rx="5" ry="11" fill="#f6d993" stroke="#bd843d" stroke-width="2"/>
      <path d="M77 91v12" stroke="#bd843d" stroke-width="2"/>
      <path d="m77 102 2.5 4 4.5 1-4.5 1.5-2.5 4-2-4-4-1.5 4-1z" fill="#f0bd58" stroke="#bd843d" stroke-width="1"/>
    </g>
    <!-- natural human hands holding a rice bowl -->
    <g class="rice-bowl">
      <path d="M74 213q-11-3-15 5-3 6 1 12l10 10q5 3 9-1l9-9m78-17q11-3 15 5 3 6-1 12l-10 10q-5 3-9-1l-9-9" fill="url(#skin)" stroke="#a87962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 221q4-7 9-7m-12 13 11 7m91-13q-4-7-9-7m12 13-11 7" fill="none" stroke="#b87e68" stroke-width="2" stroke-linecap="round"/>
      <path d="M78 215q42-10 84 0l-7 28q-35 12-70 0z" fill="#fff5e5" stroke="#a87962" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="120" cy="215" rx="42" ry="9" fill="#fffaf0" stroke="#a87962" stroke-width="2.5"/>
      <g fill="#fffdf7" stroke="#ead9c1" stroke-width="1"><ellipse cx="101" cy="210" rx="6" ry="4"/><ellipse cx="112" cy="208" rx="7" ry="4"/><ellipse cx="124" cy="208" rx="7" ry="4"/><ellipse cx="136" cy="210" rx="6" ry="4"/></g>
      <!-- separated human fingers -->
      <path d="M64 218q-5 9 3 13m7-14q-4 8 3 13m87-12q5 9-3 13m-7-14q4 8-3 13" fill="none" stroke="#a87962" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg></button></div>
    </article>
    <article class="card">
      <div class="stat"><span>碗里还剩</span><b class="big" id="left">0.00<small>%</small></b><div class="meter"><i id="meter"></i></div></div>
      <div class="stat"><span>截至现在计划应已用</span><b id="target">0.00%</b></div>
      <div class="stat"><span>和计划相比</span><b id="delta">—</b></div>
      <div class="stat"><span>追上当前目标</span><b id="gap">—</b></div>
    </article>
  </section>
  <p class="hint">饭塔随额度同步变化；无需为了吃完而刻意消耗额度。</p>
</main>
<script>
  const syncedData = { used: 10, elapsed: 4.46875, updatedAt: '2026-10-26T14:02:55Z' };
  const f=n=>Number(n).toFixed(2), used=Math.max(0,Math.min(100,Number(syncedData.used))), left=100-used, delta=used-Number(syncedData.elapsed);
  document.querySelector('#used').textContent=f(used)+'%';
  document.querySelector('#left').innerHTML=f(left)+'<small>%</small>';
  document.querySelector('#meter').style.width=left+'%';
  document.querySelector('#tower').style.setProperty('--used',used);
  document.querySelector('#target').textContent=f(syncedData.elapsed)+'%';
  document.querySelector('#delta').textContent=(delta>=0?'多吃了 ':'少吃了 ')+f(Math.abs(delta))+' 个百分点';
  document.querySelector('#gap').textContent=delta>=0?'不用追，已达标':'还差 '+f(Math.abs(delta))+'%';
  document.querySelector('#eaten').textContent=used<20?'饭山还很高':used<60?'饭山吃掉一半啦':'饭山快见底啦';

  const mascot=document.querySelector('.mascot-button'), mascotMessage=document.querySelector('#mascot-message');
  const mascotLines=['爸，陪我吃一口嘛！','呼——饭饭好香呀','嘿嘿，咩咩充电成功！','再点一下，我还会动哦'];
  let mascotClicks=0;
  mascot.addEventListener('click',()=>{
    const moves=['hop','sway','munch'];
    mascot.classList.remove('hop','sway','munch','is-active');
    void mascot.offsetWidth;
    mascot.classList.add(moves[mascotClicks%moves.length],'is-active');
    mascotMessage.textContent=mascotLines[mascotClicks%mascotLines.length];
    mascotClicks++;
  });
  mascot.addEventListener('animationend',()=>mascot.classList.remove('hop','sway','munch','is-active'));
</script>
</body>
</html>
