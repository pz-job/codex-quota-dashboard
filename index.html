<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一周白饭额度 · 本地预览</title>
  <style>
    :root{--ink:#4b3020;--muted:#957253;--paper:#fff2d2;--red:#b93822;--gold:#efa84a;--green:#43825a}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(#fff9e8 1px,transparent 1px) 0 0/22px 22px,linear-gradient(145deg,#e8a05f 0 34%,#bd3829 34% 71%,#f1c36e 71%)}
    main{max-width:1020px;margin:auto;padding:46px 22px 32px}.label{font-size:12px;font-weight:900;letter-spacing:.16em;color:#813323;background:#ffe9b3;padding:6px 10px;border-radius:99px;display:inline-block}h1{font-size:clamp(38px,6vw,74px);line-height:.96;letter-spacing:-.09em;margin:14px 0 12px;color:#fff8e7;text-shadow:0 4px #a82e23}.sub{max-width:590px;margin:0;color:#fff2cd;font-weight:700}.layout{display:grid;grid-template-columns:1.18fr .82fr;gap:22px;align-items:stretch;margin-top:28px}.card{background:rgba(255,248,229,.93);border:3px solid #fff4d8;border-radius:31px;box-shadow:0 13px 0 rgba(100,36,22,.25),0 28px 45px rgba(82,24,14,.18);padding:23px}
    .rice-card{padding:0;min-height:590px;position:relative;overflow:hidden;background:radial-gradient(circle at 8% 9%,#fffdf7 0 2px,transparent 3px) 0 0/31px 31px,#f9d98c}.rice-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(168,48,30,.1));pointer-events:none}.caption{position:absolute;z-index:2;left:22px;top:22px;color:#813124;font-size:18px;font-weight:900;line-height:1.2}.caption strong{display:block;font-size:35px;letter-spacing:-.07em;color:#c3412c}.tower-wrap{height:580px;position:relative;display:flex;justify-content:center;align-items:flex-end}.tower{height:540px;width:88%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 7px rgba(91,34,15,.22));clip-path:inset(calc(var(--used) * .74%) 0 0 0);transition:clip-path .9s ease}.token-mark{position:absolute;z-index:2;bottom:80px;left:50%;transform:translateX(-50%);padding:3px 13px 5px;border-radius:8px;border:2px solid rgba(119,50,19,.45);color:#fff0c9;background:rgba(139,58,20,.76);font:900 25px/.95 ui-rounded,system-ui;letter-spacing:.09em;text-shadow:0 2px 0 #7a3113;box-shadow:0 3px 0 rgba(92,37,13,.23)}.sheep-buddy{position:absolute;z-index:4;right:-23px;bottom:12px;width:182px;filter:drop-shadow(0 10px 5px rgba(99,41,15,.24));transform:rotate(2deg);transition:transform .25s ease}.sheep-buddy:hover{transform:rotate(-2deg) translateY(-4px)}.fish-bubble{position:absolute;z-index:5;right:132px;bottom:136px;background:#fff9e8;color:#93452b;border:2px solid #e2a059;border-radius:15px;padding:5px 8px;font-size:11px;font-weight:900;white-space:nowrap}.fish-bubble:after{content:"";position:absolute;right:-8px;bottom:7px;width:12px;height:12px;background:#fff9e8;border-right:2px solid #e2a059;border-top:2px solid #e2a059;transform:rotate(45deg)}.eaten{position:absolute;left:18px;bottom:18px;background:#fff4d9;color:#8b4829;border:2px solid #e0a75f;border-radius:18px;padding:8px 10px;font-size:12px;font-weight:800;z-index:3}
    .stat{padding:16px 0;border-bottom:1px dashed #d9aa69}.stat:first-child{padding-top:1px}.stat:last-child{border:0}.stat span{display:block;font-size:13px;color:var(--muted);font-weight:700}.stat b{display:block;font-size:25px;letter-spacing:-.06em;margin-top:3px}.big{font-size:58px!important;color:#c6402b}.big small{font-size:.4em}.meter{height:17px;background:#ecd39b;border-radius:99px;overflow:hidden;border:2px solid #dca962;margin:10px 0 4px}.meter i{display:block;height:100%;background:repeating-linear-gradient(100deg,#fffef8 0 10px,#efdcae 11px 13px);border-radius:inherit}.hint{font-size:13px;color:#fff1d5;text-align:center;margin:24px 0 0}.hint b{color:#fff}
    @media(max-width:720px){main{padding:28px 15px}.layout{grid-template-columns:1fr}.rice-card{min-height:520px}.tower-wrap{height:510px}.tower{height:470px}.sheep-buddy{width:145px;right:-16px;bottom:17px}.fish-bubble{right:102px;bottom:121px}.caption strong{font-size:30px}}
  </style>
</head>
<body>
<main>
  <span class="label">CODEX WEEKLY TOKEN</span>
  <h1>白饭堆成山，<br>才叫一周额度呀。</h1>
  <p class="sub">整座饭塔代表满额；每用一点，塔尖就被吃掉一点。现在一眼能看出还剩多少饭。</p>
  <section class="layout">
    <article class="card rice-card">
      <div class="caption">这周已经吃掉<strong id="used">0.00%</strong></div>
      <div class="tower-wrap"><img class="tower" id="tower" src="rice-tower.png" alt="高高堆起的大米饭山"><span class="token-mark">TOKEN</span><span class="eaten" id="eaten">还很高</span><span class="fish-bubble">咩咩先吃一口！</span><svg class="sheep-buddy" viewBox="0 0 220 220" role="img" aria-label="圆滚滚的小羊咩咩抱着一碗白饭">
          <ellipse cx="111" cy="204" rx="66" ry="9" fill="#8d4a25" opacity=".18"/>
          <path d="M72 167c-2-24 14-42 39-42s43 18 41 43l-4 24h-20l-3-16h-27l-4 16H75z" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <path d="M88 185h15v17H88zm38 0h15v17h-15z" fill="#f5dfc4"/>
          <circle cx="108" cy="61" r="24" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="79" cy="70" r="20" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="138" cy="71" r="21" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="69" cy="99" r="20" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="148" cy="101" r="20" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="82" cy="121" r="20" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <circle cx="135" cy="123" r="20" fill="#fffaf0" stroke="#dfc9a9" stroke-width="3"/>
          <ellipse cx="109" cy="94" rx="39" ry="43" fill="#f3d2ae"/>
          <path d="M72 78q-19-20-28-2 8 20 29 18m74-16q20-20 29-2-8 20-29 18" fill="#f3d2ae" stroke="#dfc9a9" stroke-width="3"/>
          <ellipse cx="95" cy="92" rx="3.5" ry="5" fill="#51372c"/><ellipse cx="123" cy="92" rx="3.5" ry="5" fill="#51372c"/>
          <ellipse cx="82" cy="106" rx="8" ry="5" fill="#ef9c87" opacity=".7"/><ellipse cx="136" cy="106" rx="8" ry="5" fill="#ef9c87" opacity=".7"/>
          <path d="M103 105q7 7 14 0" fill="none" stroke="#8b5542" stroke-width="3" stroke-linecap="round"/>
          <path d="M150 148q17 1 23 14" fill="none" stroke="#f3d2ae" stroke-width="10" stroke-linecap="round"/>
          <path d="M154 153q20-5 28 5l-2 19q-17 7-30-3z" fill="#fff9e8" stroke="#d7a466" stroke-width="3"/>
          <ellipse cx="164" cy="155" rx="13" ry="5" fill="#fffdf7" stroke="#d7a466" stroke-width="2"/>
          <ellipse cx="158" cy="154" rx="3" ry="2" fill="#fff"/><ellipse cx="165" cy="152" rx="3" ry="2" fill="#fff"/><ellipse cx="171" cy="155" rx="3" ry="2" fill="#fff"/>
          <path d="M77 150q-15 0-20 12" fill="none" stroke="#f3d2ae" stroke-width="10" stroke-linecap="round"/>
        </svg></div>
    </article>
    <article class="card">
      <div class="stat"><span>碗里还剩</span><b class="big" id="left">0.00<small>%</small></b><div class="meter"><i id="meter"></i></div></div>
      <div class="stat"><span>截至现在计划应已用</span><b id="target">0.00%</b></div>
      <div class="stat"><span>和计划相比</span><b id="delta">—</b></div>
      <div class="stat"><span>追上当前目标</span><b id="gap">—</b></div>
    </article>
  </section>
  <p class="hint">饭塔随额度同步变化；无需为了吃完而刻意消耗额度。</p>
</main>
<script>
  const syncedData = { used: 10, elapsed: 4.46875, updatedAt: '2026-10-26T14:02:55Z' };
  const f=n=>Number(n).toFixed(2), used=Math.max(0,Math.min(100,Number(syncedData.used))), left=100-used, delta=used-Number(syncedData.elapsed);
  document.querySelector('#used').textContent=f(used)+'%';
  document.querySelector('#left').innerHTML=f(left)+'<small>%</small>';
  document.querySelector('#meter').style.width=left+'%';
  document.querySelector('#tower').style.setProperty('--used',used);
  document.querySelector('#target').textContent=f(syncedData.elapsed)+'%';
  document.querySelector('#delta').textContent=(delta>=0?'多吃了 ':'少吃了 ')+f(Math.abs(delta))+' 个百分点';
  document.querySelector('#gap').textContent=delta>=0?'不用追，已达标':'还差 '+f(Math.abs(delta))+'%';
  document.querySelector('#eaten').textContent=used<20?'饭山还很高':used<60?'饭山吃掉一半啦':'饭山快见底啦';
</script>
</body>
</html>
